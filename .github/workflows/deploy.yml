name: Deploy SIMKASAN to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy-project:
    name: Build & Deploy SIMKASAN
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Create Production .env
        run: |
          cd frontend
          echo "VITE_API_BASE_URL=https://api-simkasan.izulvie.my.id" > .env.production

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      - name: Add .htaccess to build output
        run: |
          echo '<IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteRule ^index\.html$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteCond %{REQUEST_FILENAME} !-l
            RewriteRule . /index.html [L]
          </IfModule>' > frontend/dist/.htaccess

      - name: Compress Build Output
        run: |
          tar -czf frontend.tar.gz -C frontend/dist .

      - name: Upload Frontend Tarball via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "frontend.tar.gz"
          target: "domains/izulvie.my.id/public_html/simkasan/"

      - name: Extract Frontend & Update Backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # 1. Ekstrak Frontend
            cd domains/izulvie.my.id/public_html/simkasan
            tar -xzf frontend.tar.gz
            rm -f frontend.tar.gz

            # 2. Update Backend
            cd ../api
            git pull origin main
            cd backend
            composer install --no-dev --optimize-autoloader
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache

