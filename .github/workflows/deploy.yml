name: Deploy SIMKASAN to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy-frontend:
    name: Build & Deploy React Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Create Production .env
        run: |
          cd frontend
          echo "VITE_API_BASE_URL=https://api-simkasan.izulvie.my.id" > .env.production

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      - name: Add .htaccess to build output
        run: |
          echo '<IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteRule ^index\.html$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteCond %{REQUEST_FILENAME} !-l
            RewriteRule . /index.html [L]
          </IfModule>' > frontend/dist/.htaccess

      - name: Deploy Frontend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: frontend/dist/
          server-dir: public_html/simkasan/
          state-name: .ftp-deploy-sync-state-frontend.json

  deploy-backend:
    name: Pull & Setup Laravel Backend
    runs-on: ubuntu-latest
    needs: deploy-frontend # Menunggu frontend sukses di-build

    steps:
      - name: Trigger Git Pull & Artisan commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd domains/izulvie.my.id/public_html/api
            git pull origin main
            cd backend
            composer install --no-dev --optimize-autoloader
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
